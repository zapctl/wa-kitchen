name: Publish preview

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to publish from"
        required: true
        type: string
  push:
    branches:
      - "preview/**"

env:
  PACKAGE_TAG: preview
  BRANCH: ${{ inputs.branch || github.ref }}
  OUT_DIR: ${{ github.workspace }}/out
  DIST_DIR: ${{ github.workspace }}/out/dist

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Set up environment
        run: |
          git config --global user.name "GitHub Actions [Bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(cat out/.version)
          COMMIT_SHA=$(git rev-parse HEAD)

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "Publishing version: $VERSION from commit $COMMIT_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Generate preview packages
        run: bash generate.sh
        working-directory: tools/packager

      - name: Publish preview packages
        run: bash publish.sh
        working-directory: tools/packager

      - name: Comment preview package link on PR
        uses: actions/github-script@v8
        with:
          script: |
            const script = require('./.github/scripts/comment-pr.js');
            await script({ github, context });
